<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>Leave Management System</h1>
      <p>Sign in to your account</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="form-control"
          [class.error]="f['email'].invalid && f['email'].touched"
          placeholder="Enter your email"
        />
        <div class="error-message" *ngIf="f['email'].invalid && f['email'].touched">
          <span *ngIf="f['email'].errors?.['required']">Email is required</span>
          <span *ngIf="f['email'].errors?.['email']">Please enter a valid email</span>
        </div>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="form-control"
          [class.error]="f['password'].invalid && f['password'].touched"
          placeholder="Enter your password"
        />
        <div class="error-message" *ngIf="f['password'].invalid && f['password'].touched">
          <span *ngIf="f['password'].errors?.['required']">Password is required</span>
          <span *ngIf="f['password'].errors?.['minlength']"
            >Password must be at least 6 characters</span
          >
        </div>
      </div>
      <div class="error-message" *ngIf="error">
        {{ error }}
      </div>
      <button type="submit" class="btn-primary" [disabled]="loading">
        <span *ngIf="!loading">Sign In</span>
        <span *ngIf="loading">Signing in...</span>
      </button>
    </form>
    <div class="demo-credentials">
      <p>Demo Credentials:</p>
      <div class="demo-buttons">
        <button type="button" class="btn-demo" (click)="useDemoCredentials('manager')">
          Manager Login
        </button>
        <button type="button" class="btn-demo" (click)="useDemoCredentials('employee')">
          Employee Login
        </button>
      </div>
    </div>
  </div>
</div>
